name: MT5 EA Build Test

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find EA
        shell: powershell
        run: |
          $ea = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\MT5\Experts" `
            -Filter "*.mq5" `
            -File

          if (-not $ea) {
            throw "No MQ5 file found in MT5/Experts."
          }

          $ea | ForEach-Object {
            Write-Host "Found EA: $($_.FullName)"
          }

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $installer = "$env:TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MT5 installer download failed."
          }

          Write-Host "MT5 installer downloaded."

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:TEMP\mt5setup.exe"

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MT5 installation command completed."

      - name: Find MetaTrader 5
        shell: powershell
        run: |
          $paths = @(
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Found MT5 location: $path"
            }
          }

          $terminal = Get-ChildItem `
            -Path "$env:LOCALAPPDATA" `
            -Filter "terminal64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($terminal) {
            Write-Host "MT5 terminal found:"
            Write-Host $terminal.FullName
          }
          else {
            Write-Warning "terminal64.exe was not found automatically."
          }

      - name: Build test completed
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "MT5 BUILD TEST COMPLETED"
          Write-Host "================================"
