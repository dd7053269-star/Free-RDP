name: Compile MT5 EA

"on":
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout EA
        uses: actions/checkout@v4

      - name: Find EA
        shell: powershell
        run: |
          $ea = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\MT5\Experts" `
            -Filter "*.mq5" `
            -File

          if (-not $ea) {
            throw "No .mq5 file found."
          }

          $ea | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }

      - name: Check EA source
        shell: powershell
        run: |
          $ea = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\MT5\Experts" `
            -Filter "*.mq5" `
            -File |
            Select-Object -First 1

          Write-Host "EA: $($ea.Name)"
          Write-Host "Size: $($ea.Length) bytes"

          if ($ea.Length -eq 0) {
            throw "EA source file is empty."
          }

      - name: Build check complete
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "EA SOURCE CHECK PASSED"
          Write-Host "================================"
