name: MT5 EA Test

"on":
  workflow_dispatch:

jobs:
  mt5-test:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find EA source
        shell: powershell
        run: |
          $ea = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\MT5\Experts" `
            -Filter "*.mq5" `
            -File

          if ($null -eq $ea) {
            throw "No .mq5 EA found in MT5/Experts."
          }

          Write-Host "EA files found:"
          $ea | Select-Object FullName, Length

      - name: Display EA information
        shell: powershell
        run: |
          $files = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\MT5\Experts" `
            -Filter "*.mq5" `
            -File

          foreach ($file in $files) {
            Write-Host "--------------------------------"
            Write-Host "File: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"
            Write-Host "--------------------------------"
          }

      - name: Windows environment test
        shell: powershell
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Test completed
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "MT5 EA SOURCE TEST PASSED"
          Write-Host "===================================="
