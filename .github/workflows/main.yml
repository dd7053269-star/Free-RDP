name: Windows Test

on:
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest

    steps:
      - name: Show Windows information
        shell: powershell
        run: |
          Write-Host "Windows runner started"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Check RDP service
        shell: powershell
        run: |
          Get-Service -Name TermService

      - name: Check network
        shell: powershell
        run: |
          Get-NetIPAddress |
            Where-Object {
              $_.AddressFamily -eq "IPv4"
            } |
            Select-Object IPAddress, InterfaceAlias

      - name: Finished
        shell: powershell
        run: |
          Write-Host "Windows runner test completed successfully."
