name: Ngrok Connectivity Test

"on":
  workflow_dispatch:

jobs:
  ngrok-test:
    runs-on: windows-latest

    steps:
      - name: Download ngrok
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zip = "$env:TEMP\ngrok.zip"
          $dir = "$env:RUNNER_TEMP\ngrok"

          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          & "$dir\ngrok.exe" version

      - name: Authenticate ngrok
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "NGROK_AUTHTOKEN is missing."
          }

          & "$env:RUNNER_TEMP\ngrok\ngrok.exe" `
            config add-authtoken "$env:NGROK_AUTHTOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication failed."
          }

      - name: Start local test server
        shell: powershell
        run: |
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://127.0.0.1:8080/")
          $listener.Start()

          $script = {
            param($listener)

            while ($listener.IsListening) {
              try {
                $context = $listener.GetContext()
                $response = $context.Response

                $body = [Text.Encoding]::UTF8.GetBytes(
                  "GitHub Windows runner + ngrok connectivity test OK"
                )

                $response.ContentLength64 = $body.Length
                $response.OutputStream.Write($body, 0, $body.Length)
                $response.Close()
              }
              catch {
                break
              }
            }
          }

          Start-Job -ScriptBlock $script -ArgumentList $listener | Out-Null

          Start-Sleep -Seconds 2

          try {
            Invoke-WebRequest `
              -Uri "http://127.0.0.1:8080/" `
              -UseBasicParsing
          }
          catch {
            Write-Host "Local test server started."
          }

      - name: Start ngrok HTTP tunnel
        shell: powershell
        run: |
          $ngrok = "$env:RUNNER_TEMP\ngrok\ngrok.exe"

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "http 8080" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          $tunnels = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          $tunnels.tunnels |
            Select-Object name, public_url, proto, config |
            Format-List

      - name: Test tunnel
        shell: powershell
        run: |
          $tunnels = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          if ($tunnels.tunnels.Count -lt 1) {
            throw "No ngrok tunnel was created."
          }

          Write-Host "ngrok tunnel successfully created."

      - name: Keep runner alive briefly
        shell: powershell
        run: |
          Write-Host "Connectivity test complete."
          Start-Sleep -Seconds 30
