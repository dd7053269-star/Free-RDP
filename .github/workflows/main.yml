```yaml
name: Windows RDP Test

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest

    timeout-minutes: 360

    steps:
      - name: Show Windows information
        shell: powershell
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Check RDP service
        shell: powershell
        run: |
          Get-Service TermService
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Select-Object DisplayName, Enabled, Profile

      - name: Download ngrok
        shell: powershell
        run: |
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ngrok.zip"

          Expand-Archive `
            -Path "$env:TEMP\ngrok.zip" `
            -DestinationPath "$env:RUNNER_TEMP\ngrok" `
            -Force

          & "$env:RUNNER_TEMP\ngrok\ngrok.exe" version

      - name: Configure ngrok
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "NGROK_AUTHTOKEN GitHub Secret is missing."
          }

          & "$env:RUNNER_TEMP\ngrok\ngrok.exe" `
            config add-authtoken $env:NGROK_AUTHTOKEN

      - name: Start RDP tunnel
        shell: powershell
        run: |
          Write-Host "Starting ngrok TCP tunnel..."
          Write-Host "Use the ngrok dashboard to inspect the endpoint."
          
          Start-Process `
            -FilePath "$env:RUNNER_TEMP\ngrok\ngrok.exe" `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          Write-Host "Checking ngrok API..."
          try {
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:4040/api/tunnels" |
              ConvertTo-Json -Depth 10
          }
          catch {
            Write-Warning "Could not query the local ngrok API."
            Write-Warning $_
          }

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "Windows runner is active."
          Write-Host "This runner is temporary and will disappear when the job ends."
          
          while ($true) {
            Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - runner alive"
            Start-Sleep -Seconds 60
          }
```
