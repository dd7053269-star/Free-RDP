name: Ngrok Connectivity Test

"on":
  workflow_dispatch:

jobs:
  ngrok-test:
    runs-on: windows-latest

    steps:
      - name: Download ngrok
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zip = "$env:TEMP\ngrok.zip"
          $dir = "$env:RUNNER_TEMP\ngrok"

          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          & "$dir\ngrok.exe" version

      - name: Authenticate ngrok
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "NGROK_AUTHTOKEN is missing."
          }

          & "$env:RUNNER_TEMP\ngrok\ngrok.exe" `
            config add-authtoken "$env:NGROK_AUTHTOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication failed."
          }

      - name: Start local web server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $server = Start-Process `
            -FilePath "python" `
            -ArgumentList "-m http.server 8080 --bind 127.0.0.1" `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 3

          Write-Host "Testing local server..."

          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:8080/" `
            -UseBasicParsing

          Write-Host "Local server HTTP status: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
            throw "Local web server test failed."
          }

          Write-Host "Local server is working."

      - name: Start ngrok tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ngrok = "$env:RUNNER_TEMP\ngrok\ngrok.exe"

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "http 8080" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          $tunnels = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          if ($tunnels.tunnels.Count -lt 1) {
            throw "ngrok did not create a tunnel."
          }

          foreach ($tunnel in $tunnels.tunnels) {
            Write-Host "ngrok tunnel:"
            Write-Host "Public URL: $($tunnel.public_url)"
          }

      - name: Test ngrok tunnel
        shell: powershell
        run: |
          $tunnels = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          $publicUrl = $tunnels.tunnels[0].public_url

          Write-Host "Testing:"
          Write-Host $publicUrl

          $response = Invoke-WebRequest `
            -Uri $publicUrl `
            -UseBasicParsing

          Write-Host "HTTP status: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
            throw "ngrok tunnel test failed."
          }

          Write-Host "NGROK CONNECTIVITY TEST PASSED."
